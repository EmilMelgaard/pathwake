name: Release

# Push a tag like v1.2.3 to build a signed release, publish it to Google Play
# (internal track) and create a GitHub release. See RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::MINOR and PATCH must be <= 99 (versionCode = MAJOR*10000 + MINOR*100 + PATCH)"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set. See RELEASING.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew spotlessCheck lintRelease testReleaseUnitTest :puzzle:test bundleRelease assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/pathwake-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/pathwake-${{ steps.version.outputs.name }}.aab"

      # The very first Play upload must be done manually in Play Console; grab the AAB from here.
      - name: Upload AAB and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            dist/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.emilmelgaard.pathwake
          releaseFiles: dist/pathwake-${{ steps.version.outputs.name }}.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          # Must be 'draft' until the app has been published once on Play.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/pathwake-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
